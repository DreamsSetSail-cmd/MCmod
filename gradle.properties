# Gradle 构建选项（Gradle 9 + ForgeGradle 7）
#
# 注意：这里刻意**关闭** org.gradle.caching。
# 原因：本工程启用了 net.minecraftforge.gradle.merge-source-sets=true，
# 编译产物落在 build/sourceSets/main 而非标准的 build/classes。
# 实测出现过 compileJava 从构建缓存恢复（FROM-CACHE）却**没有还原 class 输出**的情况，
# 结果 build 显示成功、jar 却缺少全部 .class（体积从 380 KB 掉到 260 KB）——
# 一个静默的坏产物。构建可重复性比这点增量编译速度重要得多。
org.gradle.caching=false

org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

net.minecraftforge.gradle.merge-source-sets=true
