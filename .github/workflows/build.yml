name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    # 兜底：任何步骤异常挂起时，作业最多跑 45 分钟就结束，
    # 避免像 test 步骤那样无限期占用 runner。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ForgeGradle 会下载并反编译 Minecraft，首次约 5~10 分钟。
      - name: Cache ForgeGradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            .gradle
          key: forge-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle') }}
          restore-keys: |
            forge-${{ runner.os }}-

      # 语言文件校验先跑：占位符缺失会在运行时崩客户端，
      # 让它在构建之前就失败，比事后排查便宜得多。
      - name: Validate language files
        run: python3 tools/check_lang.py

      # 用 `bash gradlew` 而不是 `./gradlew`：git 在 Windows 上不记录
      # POSIX 可执行位，靠 `./gradlew` 会得到 exit 126（曾被这个问题卡过一次）。
      - name: Build
        run: bash gradlew build --no-daemon --console=plain --stacktrace

      # gameTest 在 CI 上出现过不退出、无限挂起的情况（本机稳定）。
      # 因此限制 10 分钟；超时视为失败，但不至于拖垮整个作业。
      #
      # 这里**不加 `--no-daemon`**（Build 步骤加了）。实测差别很大：
      # 带 `--no-daemon` 时 gameTest 会卡在 GameTestRunner 的进度条上不再前进，
      # 服务器每秒刷出上万行 `[ ++++]`（一次运行累计 14 万行 / 9.7 MB 日志），
      # 直到 5 分钟超时；同一个 commit 在带 daemon 的构建里约 10 秒就跑完。
      # 让 gameTest 复用守护进程，与 `main` 分支上稳定通过的那种配置保持一致。
      #
      # 另外必须显式校验日志：实测当测试服务器**启动失败**时
      # （例如 run/ 目录被另一个进程占用会话锁），
      # `runGameTestServer` 仍然返回退出码 0 并报 BUILD SUCCESSFUL——
      # 那是个假绿。所以这里额外 grep 成功标志，找不到就失败。
      - name: Run game tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          bash gradlew runGameTestServer --console=plain 2>&1 | tee gametest-raw.log
          # 折叠进度条：测试卡住时它每 tick 一行，会把日志撑到几十 MB
          grep -v -E '\[minecraft/GameTestServer\]: \[ [+]*\]$' gametest-raw.log > gametest.log || true
          tail -n 40 gametest.log
          if ! grep -q "required tests passed" gametest.log; then
            echo "::error::GameTest did not report success. The test server may have failed to start."
            exit 1
          fi

      # 把测试日志留档，方便排查 CI 上的偶发挂起
      - name: Upload game test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-log
          path: gametest.log
          if-no-files-found: ignore

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: echoes-of-oblivion-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 打 tag 推送时自动创建 Release 并附上 jar
      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
