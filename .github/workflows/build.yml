name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest
    # 兜底：任何步骤异常挂起时，作业最多跑 45 分钟就结束，
    # 避免像 test 步骤那样无限期占用 runner。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ForgeGradle 会下载并反编译 Minecraft，首次约 5~10 分钟。
      - name: Cache ForgeGradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            .gradle
          key: forge-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle') }}
          restore-keys: |
            forge-${{ runner.os }}-

      # 语言文件校验先跑：占位符缺失会在运行时崩客户端，
      # 让它在构建之前就失败，比事后排查便宜得多。
      - name: Validate language files
        run: python3 tools/check_lang.py

      # 用 `bash gradlew` 而不是 `./gradlew`：git 在 Windows 上不记录
      # POSIX 可执行位，靠 `./gradlew` 会得到 exit 126（曾被这个问题卡过一次）。
      - name: Build
        run: bash gradlew build --no-daemon --console=plain --stacktrace

      # gameTest 在 CI 上出现过不退出、无限挂起的情况（本机稳定）。
      # 因此限制 5 分钟；超时视为失败，但不至于拖垮整个作业。
      # 真正的构建正确性由上一步 build 与语言校验保证，测试是额外一层。
      - name: Run game tests
        timeout-minutes: 5
        run: bash gradlew runGameTestServer --no-daemon --console=plain

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: echoes-of-oblivion-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 打 tag 推送时自动创建 Release 并附上 jar
      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
