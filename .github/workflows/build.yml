name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # ForgeGradle 会下载并反编译 Minecraft，首次约 5~10 分钟。
      # 这里显式缓存，让后续运行命中。
      - name: Cache ForgeGradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            .gradle
          key: forge-${{ runner.os }}-${{ hashFiles('build.gradle', 'gradle.properties', 'settings.gradle') }}
          restore-keys: |
            forge-${{ runner.os }}-

      # 语言文件校验先跑：占位符缺失会在运行时崩客户端，
      # 让它在构建之前就失败，比事后排查便宜得多。
      - name: Validate language files
        run: python3 tools/check_lang.py

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Run game tests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload jar as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: echoes-of-oblivion-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 打 tag 推送时自动创建 Release 并附上 jar
      - name: Attach jar to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
