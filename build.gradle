// Echoes of Oblivion —— Minecraft 1.20.6 / Forge 模组
// 构建说明见 README.md；素材来源与授权见 CREDITS.md。

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

// 发布用版本号：包含模组版本、目标 MC 版本与加载器，便于玩家辨认该装哪个文件。
// 产物名形如 echoes-of-oblivion-1.2.0-mc1.20.6-forge.jar
version = '1.2.0-mc1.20.6-forge'
group = 'com.clion.echoesofoblivion'

// jar 文件名前缀（默认会取项目名 echoes_of_oblivion，这里改为连字符风格更易读）
base {
    archivesName = 'echoes-of-oblivion'
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

// datagen 会在输出目录写出 .cache/ 作为增量标记（Forge CachedOutput 的哈希 -->
// 时间戳映射）。它只是构建期缓存，不应该进入发布产物，否则 jar 里会多出无用文件。
processResources {
    exclude '.cache/**'
}

minecraft {
    mappings channel: 'official', version: '1.20.6'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'forge.enabledGameTestNamespaces', 'echoesofoblivion'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'echoesofoblivion', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.20.6-50.2.10')
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}
